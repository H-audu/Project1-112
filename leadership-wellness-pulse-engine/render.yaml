services:
  - type: web
    name: leadership-wellness-api
    runtime: docker
    rootDir: server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadership-wellness-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://your-vercel-domain.vercel.app

databases:
  - name: leadership-wellness-db
    databaseName: wellness_pulse
    user: wellness
